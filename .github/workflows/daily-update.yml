name: Daily data update

on:
  schedule:
    # GitHub cron is UTC. 10:00 UTC = 12:00 Madrid during CEST (summer).
    # In winter (CET) this fires at 11:00 local — adjust to '0 11 * * *' after
    # the October DST change if the exact local hour matters.
    - cron: '0 10 * * *'
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      # Same secret conventions as publisher_pnl: GOOGLE_TOKEN (contents of
      # token.json), DRIVE_SA (service-account JSON), TRINO_USER (email).
      # token.json in the project root is honoured by tools/trino_client.py.
      - name: Write credential files
        run: |
          echo "$GOOGLE_TOKEN" > token.json
          echo "$DRIVE_SA" > drive_sa.json
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
          DRIVE_SA: ${{ secrets.DRIVE_SA }}

      - name: Build dashboard and upload to Drive
        env:
          TRINO_USER: ${{ secrets.TRINO_USER }}
          DRIVE_SA_JSON: drive_sa.json
        run: uv run python generate_report_v2.py --upload

      - name: Commit refreshed data
        run: |
          rm -f token.json drive_sa.json   # never let credentials near the commit
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit"
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload HTML as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: adex_dashboard_v2_html
          path: output/adex_dashboard_v2.html
          retention-days: 14
